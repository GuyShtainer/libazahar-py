# Best effort: the slow tests (they boot the emulator) on a macOS runner, with our public v1.0.0 core. A hosted runner
# may have no usable Vulkan path, so a red result here never blocks anything: continue-on-error is set on the job, and
# the result is read from the pytest step's own outcome and its summary line (passed above 0, failed 0), never from the
# run's conclusion. The step "the user recipe's run-and-verdict part, on our test app" (id: recipe) is read the same
# way: its own outcome must be success and its log must end with a "verdict ok" line.
name: macos-live

# Started by hand only: macOS runners often never start here, and each cancelled run mails the owner.
on:
  workflow_dispatch:
    inputs:
      host:
        description: "build: make the host from this commit; release: fetch.sh --host, the release's prebuilt host (the no-compiler route, no make)"
        type: choice
        options: [build, release]
        default: build

permissions:
  contents: read

jobs:
  live:
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: MoltenVK, headers, our core and the test app (pinned by sha256)
        run: sh tools/fetch.sh --moltenvk --headers --lazpy-core --testapp
      - name: build the host
        if: ${{ inputs.host != 'release' }}
        run: make
      - name: the prebuilt host from the release (no make)
        if: ${{ inputs.host == 'release' }}
        run: |
          sh tools/fetch.sh --host
          test -f build/libazhost.dylib && test -x build/azhost
          test ! -d build/obj
      - name: Python layer
        run: |
          python -m venv .venv
          .venv/bin/pip install -e . pytest numpy
      - name: every test, emulator required
        id: pytest
        env:
          LAZ_REQUIRE_EMULATOR: "1"
        run: .venv/bin/python -m pytest -q -rs tests/python
      # The recipe of docs/CI.md (examples/ci/macos.yml), run on our test app, with the host the input chose: made by
      # "build the host", or with host: release the release's prebuilt one, fetched with `fetch.sh --host` as the
      # recipe does. A failure here is read like the step above (continue-on-error on the job).
      - name: the user recipe's run-and-verdict part, on our test app
        id: recipe
        if: ${{ !cancelled() }}      # runs even when the pytest step above failed, and never changes how that step is read
        run: .venv/bin/python examples/verdict.py build/testapp.3dsx
