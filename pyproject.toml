[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "libazahar-py"
version = "1.2.0"
description = "A headless, scriptable Azahar (libretro core) for testing Nintendo 3DS homebrew"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"

[project.optional-dependencies]
numpy = ["numpy"]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["libazahar"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = ["slow: needs the emulator", "needs_core: needs the host library, a core or the emulator (its skips are allowed in the fast tier)"]
